name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmcc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Haskell (GHC + Stack)
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Cache Stack
        uses: actions/cache@v6
        with:
          path: |
            ~/.stack
            **/.stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'compiler/kmcc.cabal', 'curry-frontend/curry-frontend.cabal', 'rts/rts.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Setup Z3
        id: z3
        uses: cda-tum/setup-z3@v1

      - name: Build frontend
        run: |
          make CYPM=/bin/true frontend

      - name: Setup Prolog (SWI-Prolog) and rlwrap
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog rlwrap

      - name: Download PAKCS
        run: |
          wget https://www.curry-lang.org/pakcs/download/pakcs-3.9.0-amd64-Linux.tar.gz
          tar xzf pakcs-3.9.0-amd64-Linux.tar.gz

      - name: Cache PAKCS
        uses: actions/cache@v6
        with:
          path: pakcs-3.9.0
          key: ${{ runner.os }}-pakcs

      - name: Build PAKCS
        run: |
          cd pakcs-3.9.0
          make CI_BUILD=yes

      - name: Build KMCC binaries via Make (excluding repl)
        run: |
          make CYPM=/bin/true bin/kmcc_c prebuild_prelude generate_distribution

      - name: Build KMCC repl
        run: |
          make CURRYBIN_REPL_ARG_1= CURRYBIN_REPL_ARG_2="-d CURRYBIN=$PWD/bin/kmcc" CYPM=$PWD/pakcs-3.9.0/bin/cypm PAKCS=$PWD/pakcs-3.9.0/bin/pakcs bin/kmcc_repl

      - name: Build KMCC tools
        run: |
          make currytools
          make tools

      - name: Prebuild libraries
        run: make compile-all-libs

      - name: List produced binaries
        run: ls -l bin

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v7
        with:
          name: kmcc-binaries
          path: bin/*
          if-no-files-found: warn

      - name: Pack workspace (exclude VCS and caches)
        id: pack_ws
        run: |
          set -euo pipefail
          REPO_DIR="$(pwd)"
          REPO_NAME="$(basename "$REPO_DIR")"
          OUT="$RUNNER_TEMP/${REPO_NAME}.tar.gz"
          tar -C "$(dirname "$REPO_DIR")" \
            --exclude="$REPO_NAME/.git" \
            --exclude="$REPO_NAME/**/.git" \
            --exclude="$REPO_NAME/**/.stack-work" \
            --exclude="$REPO_NAME/pakcs-3.9.0" \
            --exclude-vcs \
            --exclude-from=.tarignore \
            -czf "$OUT" "$REPO_NAME"
          echo "archive=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v7
        with:
          name: kmcc-workspace
          path: ${{ steps.pack_ws.outputs.archive }}

      - name: Summary
        run: |
          echo "KMCC build completed."

  testsuite:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v8
        with:
          name: kmcc-workspace
          path: artifacts/workspace

      - name: Download binaries artifact
        uses: actions/download-artifact@v8
        with:
          name: kmcc-binaries
          path: artifacts/bin

      - name: Restore built workspace
        run: |
          archive=$(find artifacts/workspace -name '*.tar.gz' -print -quit)
          test -n "$archive"
          tar -xzf "$archive" -C ..
          cp artifacts/bin/* bin/
          chmod +x bin/kmcc bin/kmcc_c bin/kmcc-frontend bin/kmcc_repl
          test -x bin/kmcc_c

      - name: Inspect restored workspace layout
        run: |
          pwd
          echo '--- artifact staging ---'
          find artifacts -maxdepth 4 -printf '%M %p\n' | sort
          echo '--- restored workspace ---'
          find . -maxdepth 3 -printf '%M %p\n' | sort
          echo '--- resolved compiler paths ---'
          readlink -f bin/kmcc
          readlink -f bin/kmcc_c

      - name: Setup Prolog (SWI-Prolog) and rlwrap
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog rlwrap

      - name: Download PAKCS
        run: |
          wget https://www.curry-lang.org/pakcs/download/pakcs-3.9.0-amd64-Linux.tar.gz
          tar xzf pakcs-3.9.0-amd64-Linux.tar.gz

      - name: Cache PAKCS
        uses: actions/cache@v6
        with:
          path: pakcs-3.9.0
          key: ${{ runner.os }}-pakcs

      - name: Build PAKCS
        run: |
          cd pakcs-3.9.0
          make CI_BUILD=yes

      - name: Run legacy regression tests
        run: |
          echo "workspace: $GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type d -print | sort
          cd "$GITHUB_WORKSPACE/testing"
          export CURRYHOME="$GITHUB_WORKSPACE/kmcc"
          export PATH="$CURRYHOME/bin:$PATH"
          command -v kmcc
          test -x "$CURRYHOME/bin/kmcc_c"
          file "$CURRYHOME/bin/kmcc_c"
          ldd "$CURRYHOME/bin/kmcc_c"
          "$CURRYHOME/bin/kmcc_c" --numeric-version
          ./test.sh

      - name: Cache CurryCheck
        uses: actions/cache@v6
        with:
          path: ~/.cpm
          key: ${{ runner.os }}-currycheck-4.0.0

      - name: Install CurryCheck via CPM
        run: |
          export PATH="$GITHUB_WORKSPACE/pakcs-3.9.0/bin:$HOME/.cpm/bin:$PATH"
          cypm update
          cypm install currycheck
          test -x "$HOME/.cpm/bin/curry-check"
          echo "$HOME/.cpm/bin" >> "$GITHUB_PATH"

      - name: Run testsuite
        working-directory: testsuite
        run: |
          export PATH="$GITHUB_WORKSPACE/pakcs-3.9.0/bin:$GITHUB_WORKSPACE/kmcc/bin:$PATH"
          command -v curry-check
          ./test.sh
